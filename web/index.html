<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSCAN - 网络安全资产扫描平台</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <!-- 款式字体预加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // 在页面渲染前尽早设置主题类，避免浅色→深色闪烁
    ;(function() {
      var theme = localStorage.getItem('theme') || 'system'
      var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.add(isDark ? 'dark' : 'light')
      var themeStyle = localStorage.getItem('themeStyle') || 'vercel'
      document.documentElement.classList.add('style-' + themeStyle)
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
