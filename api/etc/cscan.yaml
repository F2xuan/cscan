Name: cscan-api
Host: 0.0.0.0
Port: 8888
MaxBytes: 104857600  # 100MB
Timeout: 300000      # 5分钟超时 (毫秒)

Log:
  Level: info
  Stat: false
  Mode: console
  Encoding: plain
  TimeFormat: "2006-01-02 15:04:05"
  MaxContentLength: 4096
  
Auth:
  # JWT Secret: 优先从环境变量 CSCAN_JWT_SECRET 读取
  # 如未设置，将自动生成随机 secret（仅适用于开发环境）
  AccessSecret: ""
  AccessExpire: 86400

Mongo:
  Uri: "mongodb://localhost:27017"
  DbName: "cscan"

Redis:
  Host: "localhost:6379"
  Pass: ""
  Type: node

TaskRpc:
  Endpoints:
    - 127.0.0.1:9000
  Timeout: 30000
  NonBlock: true  # 非阻塞拨号：API 可在 RPC 未启动时正常启动，调用时才报错

Docker:
  Host: ""
  ContainerPrefix: "cscan"
  ImageRegistry: "registry.cn-hangzhou.aliyuncs.com/txf7/"
  LogDir: "log/containers"
  RetentionDays: 7