x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # Redis
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/redis:7-alpine
    container_name: cscan_redis
    command: redis-server --appendonly yes --requirepass ${CSCAN_REDIS_PASSWORD}
    logging: *default-logging
    volumes:
      - cscan_redis_data:/data
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=${CSCAN_REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CSCAN_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MongoDB
  mongodb:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/mongo:6
    container_name: cscan_mongodb
    logging: *default-logging
    volumes:
      - cscan_mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - TZ=Asia/Shanghai
      - MONGO_INITDB_ROOT_USERNAME=${CSCAN_MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${CSCAN_MONGO_ROOT_PASSWORD}
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # CSCAN API 服务
  cscan-api:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-api:latest
    container_name: cscan_api
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
      - CSCAN_MONGO_URI=mongodb://${CSCAN_MONGO_ROOT_USERNAME}:${CSCAN_MONGO_ROOT_PASSWORD}@mongodb:27017/cscan
      - CSCAN_REDIS_PASSWORD=${CSCAN_REDIS_PASSWORD}
    volumes:
      - cscan_api_data:/app/data
      - ./log:/app/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8888"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CSCAN RPC 服务
  cscan-rpc:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-rpc:latest
    container_name: cscan_rpc
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
      - CSCAN_MONGO_URI=mongodb://${CSCAN_MONGO_ROOT_USERNAME}:${CSCAN_MONGO_ROOT_PASSWORD}@mongodb:27017/cscan
      - CSCAN_REDIS_PASSWORD=${CSCAN_REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cscan_network

  # CSCAN Web 服务
  cscan-web:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-web:latest
    container_name: cscan_web
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
      - "7777:443"
    volumes:
      - cscan_ssl_certs:/etc/nginx/ssl
    depends_on:
      - cscan-api
    restart: unless-stopped
    networks:
      - cscan_network

  # CSCAN Worker 默认节点
  cscan-worker:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-worker:latest
    container_name: cscan_worker
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
      - CSCAN_SERVER=http://cscan-api:8888
      - CSCAN_KEY=${CSCAN_WORKER_KEY}
      - CSCAN_NAME=cscan-default-worker
      - CSCAN_MONGO_URI=mongodb://${CSCAN_MONGO_ROOT_USERNAME}:${CSCAN_MONGO_ROOT_PASSWORD}@mongodb:27017/cscan
    depends_on:
      cscan-api:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cscan_network
    volumes:
      - cscan_worker_logs:/app/log

volumes:
  cscan_redis_data:
    driver: local
  cscan_mongodb_data:
    driver: local
  cscan_ssl_certs:
    driver: local
  cscan_api_data:
    driver: local
  cscan_worker_logs:
    driver: local

networks:
  cscan_network:
    driver: bridge
