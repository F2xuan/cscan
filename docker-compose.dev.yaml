# 本地开发用 - 仅启动依赖服务（MongoDB, Redis）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: cscan_redis_dev
    command: redis-server --appendonly yes
    logging: *default-logging
    ports:
      - "6379:6379"
    volumes:
      - cscan_redis_data_dev:/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:6
    container_name: cscan_mongodb_dev
    logging: *default-logging
    ports:
      - "27017:27017"
    volumes:
      - cscan_mongodb_data_dev:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - TZ=Asia/Shanghai
      - MONGO_INITDB_DATABASE=cscan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  cscan_redis_data_dev:
    driver: local
  cscan_mongodb_data_dev:
    driver: local