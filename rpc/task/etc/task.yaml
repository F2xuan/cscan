Name: task.rpc
ListenOn: 0.0.0.0:9000
Timeout: 30000    # gRPC 请求超时（毫秒），长轮询 CheckTask 最多等待 25s，此处需大于 25s
MaxRecvMsgSize: 104857600
MaxSendMsgSize: 104857600

# Middlewares 配置：调整慢调用阈值，避免 CheckTask 长轮询空返回被误报为慢调用
Middlewares:
  Stat: true
  StatConf:
    SlowThreshold: 30s           # 慢调用阈值设为 30s（长轮询最多 25s，正常返回不应触发）
    IgnoreContentMethods:        # 以下方法不记录请求/响应内容，减少日志噪音
      - /task.TaskService/CheckTask

Log:
  Level: info
  Stat: false
  Mode: console
  Encoding: plain
  TimeFormat: "15:04:05"
  
Mongo:
  Uri: "mongodb://localhost:27017"
  DbName: "cscan"

RedisConf:
  Host: "localhost:6379"
  Pass: ""
  Type: node
