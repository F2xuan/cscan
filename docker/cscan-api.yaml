Name: cscan-api
Host: 0.0.0.0
Port: 8888
MaxBytes: 104857600  # 100MB
Timeout: 300000      # 5分钟超时 (毫秒)

Log:
  Level: info
  Stat: false
  Mode: console
  Encoding: plain
  TimeFormat: "2006-01-02 15:04:05"

Auth:
  # 留空，由环境变量 CSCAN_JWT_SECRET 注入（见 config.LoadSecretFromEnv）
  AccessSecret: ""
  AccessExpire: 86400

Mongo:
  # 默认指向 compose 内部主机名；生产凭证由 CSCAN_MONGO_URI 覆盖（需含 authSource）
  Uri: "mongodb://mongodb:27017"
  DbName: "cscan"

Redis:
  # 默认指向 compose 内部主机名；密码由 CSCAN_REDIS_PASSWORD 注入
  Host: "redis:6379"
  Pass: ""
  Type: node

Docker:
  Host: ""
  ContainerPrefix: "cscan"
  ImageRegistry: "registry.cn-hangzhou.aliyuncs.com/txf7/"
  LogDir: "log/containers"
  RetentionDays: 7
